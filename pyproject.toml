[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-ecommerce-mcp"
version = "0.3.0"
description = "Read-only MCP server giving AI assistants one door to the Google services an online shop lives on: GA4, Search Console, Merchant Center, Tag Manager, Indexing API and PageSpeed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "MoonEyes", email = "contact@mooneyeswargame.com" }]
keywords = ["mcp", "model-context-protocol", "google-analytics", "ga4", "search-console", "merchant-center", "google-tag-manager", "ecommerce", "seo", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "mcp>=1.10,<2",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
    "requests>=2.31",
    "keyring>=24",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
google-ecommerce-mcp = "google_ecommerce_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/MoonEyes/google-ecommerce-mcp"
Issues = "https://github.com/MoonEyes/google-ecommerce-mcp/issues"
Documentation = "https://github.com/MoonEyes/google-ecommerce-mcp/tree/main/docs"
Changelog = "https://github.com/MoonEyes/google-ecommerce-mcp/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
exclude = ["docs/diagrams/*.html", "docs/diagrams/*.png", ".github"]

[tool.hatch.build.targets.wheel]
packages = ["src/google_ecommerce_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
